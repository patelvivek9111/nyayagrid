# NyayaGrid staging on Fly.io. Not production.
# App is created with `fly apps create`; first deploy waits until Clerk, DB, and
# other required secrets exist. Do not set AI_PROVIDER=mock, EMBEDDING_PROVIDER=mock,
# MALWARE_SCANNER=development, or INNGEST_DEV here. AUTH_PROVIDER=dev is refused at boot
# unless ALLOW_STAGING_DEV_AUTH=1 is also set (temporary testing only).

app = "nyayagrid-staging"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  APP_ENV = "staging"
  NODE_ENV = "production"
  FEATURE_AGENTS = "0"
  PORT = "3000"
  AUTH_PROVIDER = "clerk"
  AI_PROVIDER = "openai"
  EMBEDDING_PROVIDER = "openai"
  MALWARE_SCANNER = "clamav"
  OCR_PROVIDER = "none"
  BILLING_PROVIDER = "database"
  STORAGE_PROVIDER = "s3"

# Migrations are NOT run automatically on deploy (WP-05B).
# Application image deploys are independent from schema changes.
# Reviewed staging/production migrations:
#   APP_ENV=staging \
#   ALLOW_DATABASE_MIGRATE=1 \
#   EXPECTED_MIGRATE_DB_HOST=<host> \
#   EXPECTED_MIGRATE_DB_NAME=<db> \
#   DATABASE_URL=<product-db> \
#   npm run db:migrate
# Never point DATABASE_URL at CORPUS_DATABASE_URL / the legal corpus.
# migrate.cjs remains in the image for explicit operator use only — do not restore release_command
# without a separate approved migration change.

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]
  # Shared IPv4 only. Do not allocate a dedicated address.

[[http_service.checks]]
  grace_period = "20s"
  interval = "15s"
  method = "GET"
  path = "/api/health/live"
  timeout = "5s"
  protocol = "http"

# 1 CPU / 1GB is enough for staging Next.js. 2 CPU / 2GB would add ~$5–6/month
# for unused headroom. Scale up only if the app OOMs. Shared IPv4 only — do not
# allocate a dedicated IPv4 ($2/month). No volumes, Postgres, or Redis on Fly.
[[vm]]
  size = "shared-cpu-1x"
  memory = "1024mb"
  memory_mb = 1024
