# NyayaGrid staging on Fly.io. Not production.
# App is created with `fly apps create`; first deploy waits until Clerk, DB, and
# other required secrets exist. Do not set AUTH_PROVIDER=dev, AI_PROVIDER=mock,
# EMBEDDING_PROVIDER=mock, MALWARE_SCANNER=development, or INNGEST_DEV here.

app = "nyayagrid-staging"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  APP_ENV = "staging"
  NODE_ENV = "production"
  FEATURE_AGENTS = "0"
  PORT = "3000"
  AUTH_PROVIDER = "clerk"
  AI_PROVIDER = "openai"
  EMBEDDING_PROVIDER = "openai"
  MALWARE_SCANNER = "clamav"
  OCR_PROVIDER = "none"
  BILLING_PROVIDER = "database"
  STORAGE_PROVIDER = "s3"

[deploy]
  release_command = "node /app/migrate.cjs"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]
  # Shared IPv4 only. Do not allocate a dedicated address.

[[http_service.checks]]
  grace_period = "20s"
  interval = "15s"
  method = "GET"
  path = "/api/health/live"
  timeout = "5s"
  protocol = "http"

# 1 CPU / 1GB is enough for staging Next.js. 2 CPU / 2GB would add ~$5–6/month
# for unused headroom. Scale up only if the app OOMs. Shared IPv4 only — do not
# allocate a dedicated IPv4 ($2/month). No volumes, Postgres, or Redis on Fly.
[[vm]]
  size = "shared-cpu-1x"
  memory = "1024mb"
  memory_mb = 1024
